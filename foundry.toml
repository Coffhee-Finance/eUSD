[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@fhenixprotocol/=node_modules/@fhenixprotocol/",
  "@layerzerolabs/=node_modules/@layerzerolabs/",
  "forge-std/=lib/forge-std/src/"
]